name: Foundation CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0, Node 24
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pom.xml
          overwrite-settings: false
      - name: Maven verification
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp clean verify
      - name: Docker build verification
        run: docker build -t vigo-notification-service:ci .
      - name: Container smoke test
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name notification-smoke -e SERVER_PORT=18080 -p 127.0.0.1:18080:18080 vigo-notification-service:ci
          test "$(docker inspect --format '{{.Config.User}}' notification-smoke)" = '10001:10001'
          test "$(docker exec notification-smoke id -u)" = '10001'
          test "$(docker exec notification-smoke id -g)" = '10001'
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18080/actuator/health > /tmp/notification-health.json; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          jq -e '. == {"status":"UP"}' /tmp/notification-health.json
          curl --fail --silent --max-time 5 http://127.0.0.1:18080/actuator/info | jq -e '. == {}'
          for route in env configprops beans loggers heapdump; do
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 "http://127.0.0.1:18080/actuator/$route")" = 404
          done
      - name: Container failure logs
        if: failure()
        run: docker logs notification-smoke || true
      - name: Clean up container
        if: always()
        run: docker rm -f notification-smoke 2>/dev/null || true
