server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: vigo-notification-service
  config:
    import: optional:file:./.env[.properties]
  jmx:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:vigo-notification-service-v1}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        allow.auto.create.topics: false
    listener:
      ack-mode: record
    admin:
      auto-create: false
notification:
  kafka:
    enabled: ${NOTIFICATION_KAFKA_ENABLED:false}
  smtp:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    security: ${SMTP_SECURITY:STARTTLS}
    auth: ${SMTP_AUTH:true}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from-address: ${SMTP_FROM_ADDRESS:}
    from-name: ${SMTP_FROM_NAME:Vigo}
    connect-timeout-ms: ${SMTP_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${SMTP_READ_TIMEOUT_MS:5000}
    write-timeout-ms: ${SMTP_WRITE_TIMEOUT_MS:5000}
  logging:
    vector:
      enabled: ${LOG_VECTOR_ENABLED:true}
      destination: ${LOG_VECTOR_DESTINATION:localhost:5044}
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.eclipse.angus.mail: WARN
  pattern:
    correlation: "%correlationId"
management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,info
      discovery:
        enabled: false
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: false
    info:
      access: read-only
  info:
    defaults:
      enabled: false
