spring:
  application:
    name: vigo-notification-service
  jmx:
    enabled: false
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,info
      discovery:
        enabled: false
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: false
    info:
      access: read-only
  info:
    defaults:
      enabled: false
