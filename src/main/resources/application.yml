spring:
  application:
    name: vigo-notification-service
  jmx:
    enabled: false
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    test-connection: false
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS_ENABLED:true}
      "[mail.smtp.starttls.required]": ${SMTP_STARTTLS_ENABLED:true}
      "[mail.smtp.connectiontimeout]": ${SMTP_CONNECTION_TIMEOUT_MS:5000}
      "[mail.smtp.timeout]": ${SMTP_READ_TIMEOUT_MS:5000}
      "[mail.smtp.writetimeout]": ${SMTP_WRITE_TIMEOUT_MS:5000}
      "[mail.debug]": false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:vigo-notification-service-v1}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        allow.auto.create.topics: false
    listener:
      ack-mode: record
    admin:
      auto-create: false
notification:
  email:
    enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    from-address: ${SMTP_FROM_ADDRESS:}
  kafka:
    enabled: ${NOTIFICATION_KAFKA_ENABLED:false}
server:
  port: ${SERVER_PORT:8080}
management:
  health:
    mail:
      enabled: false
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health,info
      discovery:
        enabled: false
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: false
    info:
      access: read-only
  info:
    defaults:
      enabled: false
